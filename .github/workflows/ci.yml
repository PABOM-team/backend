name: CI and DEV Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# 소스 조회에 필요한 최소 권한만 부여한다.
permissions:
  contents: read

jobs:
  develop-branch-name:
    name: Check develop PR branch name
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Validate develop pull request branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|refactor|chore|docs|test|hotfix|release)/pabom-[0-9]+$'
          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "::error::Invalid branch name: $BRANCH_NAME"
            echo "Expected format: chore/pabom-8"
            exit 1
          fi

  main-branch-name:
    name: Check main PR source branch
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Require develop as the source branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [ "$BRANCH_NAME" != "develop" ]; then
            echo "::error::main pull requests must be opened from develop."
            exit 1
          fi

  build:
    name: Build and validate
    runs-on: ubuntu-latest
    concurrency:
      group: ci-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    # CI에서만 사용하는 일회성 MySQL 접속 정보다.
    env:
      SPRING_PROFILES_ACTIVE: ci
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: pabom_ci
      DB_USERNAME: pabom_ci
      DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: pabom_ci
          MYSQL_USER: pabom_ci
          MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u$MYSQL_USER -p$MYSQL_PASSWORD --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify CI MySQL service
        shell: bash
        run: |
          set -euo pipefail
          echo "Spring profile: $SPRING_PROFILES_ACTIVE"
          echo "JDBC target: mysql://$DB_HOST:$DB_PORT/$DB_NAME"
          docker inspect --format='{{.State.Health.Status}}' '${{ job.services.mysql.id }}' | grep -Fx healthy

      - name: 1. Compile source
        run: ./gradlew clean compileJava --no-daemon

      - name: 2. Run automated tests
        run: ./gradlew test --no-daemon

      - name: 3. Build executable JAR and verify Flyway migrations
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew bootJar --no-daemon
          test -f build/libs/app.jar
          migration_count="$(jar tf build/libs/app.jar | grep -Ec '^BOOT-INF/classes/db/migration/V[^/]+__[^/]+\.sql$' || true)"
          if [ "$migration_count" -eq 0 ]; then
            echo "::error::No versioned Flyway migration was packaged in app.jar."
            exit 1
          fi
          echo "Verified $migration_count Flyway migration file(s) in app.jar."

      - name: 4. Validate application startup and migrations on MySQL 8.4
        shell: bash
        run: |
          set -euo pipefail
          log_file="build/mysql-startup-check.log"
          java -jar build/libs/app.jar --server.port=18080 > "$log_file" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health > /dev/null; then
              echo "Application started successfully after Flyway migration and JPA validation."
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::Application exited during the MySQL migration check."
              cat "$log_file"
              exit 1
            fi
            sleep 2
          done

          echo "::error::Application did not become healthy within 120 seconds."
          cat "$log_file"
          exit 1

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-${{ github.sha }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/mysql-startup-check.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload DEV deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: pabom-dev-${{ github.sha }}
          path: build/libs/app.jar
          if-no-files-found: error
          retention-days: 1

  deploy-dev:
    name: Deploy DEV
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: arn:aws:iam::660008587020:role/pabom-dev-github-actions-role
      DEV_DEPLOY_BUCKET: pabom-dev-assets-660008587020-660008587020-ap-northeast-2-an
      DEV_DEPLOY_PREFIX: deploy/dev/${{ github.sha }}
      DEV_INSTANCE_ID: i-09893c17f40d15314

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: pabom-dev-${{ github.sha }}
          path: build/libs

      - name: Validate deployment bundle
        run: |
          set -euo pipefail
          test -f build/libs/app.jar
          test -f deploy/deploy-dev.sh
          test -f deploy/pabom-dev.service
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pabom-dev-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      - name: Prepare and upload deployment bundle
        run: |
          set -euo pipefail
          sha256sum build/libs/app.jar | awk '{print $1}' > app.jar.sha256
          destination="s3://${DEV_DEPLOY_BUCKET}/${DEV_DEPLOY_PREFIX}"
          aws s3 cp build/libs/app.jar "$destination/app.jar" --only-show-errors
          aws s3 cp app.jar.sha256 "$destination/app.jar.sha256" --only-show-errors
          aws s3 cp deploy/deploy-dev.sh "$destination/deploy-dev.sh" --only-show-errors
          aws s3 cp deploy/pabom-dev.service "$destination/pabom-dev.service" --only-show-errors

      - name: Send deployment command to the DEV instance
        id: send-command
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="/tmp/pabom-deploy-${GITHUB_SHA}"
          source="s3://${DEV_DEPLOY_BUCKET}/${DEV_DEPLOY_PREFIX}"
          remote_command=$(printf '%s\n' \
            'set -Eeuo pipefail' \
            "release_dir='$remote_dir'" \
            'cleanup() {' \
            '  rm -f "$release_dir/app.jar" "$release_dir/app.jar.sha256" "$release_dir/deploy-dev.sh" "$release_dir/pabom-dev.service"' \
            '  rmdir "$release_dir" 2>/dev/null || true' \
            '}' \
            'trap cleanup EXIT' \
            'install -d -m 0700 "$release_dir"' \
            "aws s3 cp --only-show-errors '$source/app.jar' \"\$release_dir/app.jar\"" \
            "aws s3 cp --only-show-errors '$source/app.jar.sha256' \"\$release_dir/app.jar.sha256\"" \
            "aws s3 cp --only-show-errors '$source/deploy-dev.sh' \"\$release_dir/deploy-dev.sh\"" \
            "aws s3 cp --only-show-errors '$source/pabom-dev.service' \"\$release_dir/pabom-dev.service\"" \
            'chmod 0700 "$release_dir/deploy-dev.sh"' \
            '"$release_dir/deploy-dev.sh" "$release_dir/app.jar" "$release_dir/app.jar.sha256" "$release_dir/pabom-dev.service"')
          parameters=$(jq -cn --arg command "$remote_command" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$DEV_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Pabom DEV ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          test -n "$command_id"
          echo "command-id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and report result
        shell: bash
        run: |
          set -euo pipefail
          command_id='${{ steps.send-command.outputs.command-id }}'
          invocation='{}'
          status='Pending'
          for attempt in {1..180}; do
            if invocation=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$DEV_INSTANCE_ID" \
              --output json 2>/dev/null); then
              status=$(jq -r '.Status' <<< "$invocation")
              case "$status" in
                Success|Cancelled|TimedOut|Failed|Cancelling)
                  break
                  ;;
              esac
            fi
            sleep 5
          done

          status=$(jq -r '.Status' <<< "$invocation")
          stdout=$(jq -r '.StandardOutputContent // empty' <<< "$invocation")
          stderr=$(jq -r '.StandardErrorContent // empty' <<< "$invocation")

          if [ -n "$stdout" ]; then
            printf '%s\n' '--- SSM deployment output ---' "$stdout"
          fi
          if [ -n "$stderr" ]; then
            printf '%s\n' '--- SSM deployment errors ---' "$stderr" >&2
          fi
          if [ "$status" != 'Success' ]; then
            echo "::error::DEV deployment command finished with status: $status"
            exit 1
          fi
          echo "DEV deployment command completed successfully."
