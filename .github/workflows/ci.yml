name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# 소스 조회에 필요한 최소 권한만 부여한다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # CI에서만 사용하는 일회성 MySQL 접속 정보다.
    env:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: pabom_ci
      DB_USERNAME: pabom_ci
      DB_PASSWORD: ci_password

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: pabom_ci
          MYSQL_USER: pabom_ci
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper 실행 권한 설정
        run: chmod +x gradlew

      - name: 빌드 및 테스트
        run: ./gradlew clean build
