spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:pabom}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:pabomUser}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes}
  aws:
    s3:
      bucket: ${S3_BUCKET:pabom-local}
