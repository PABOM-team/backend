spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3307/${DB_NAME:pabom}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:pabomUser}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
