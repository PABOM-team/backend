spring:
  application:
    name: pabom-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

app:
  auth:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    app-redirect:
      allowed-uris: ${AUTH_APP_REDIRECT_URIS:pabom://auth/callback/{provider},pabom-dev://auth/callback/{provider}}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-seconds: 1800
    signup-expiration-seconds: 600
    refresh-expiration-seconds: 1209600
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    app-id: ${KAKAO_APP_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
    app-redirect-uri: ${KAKAO_APP_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/app-callback}
    state-cookie-secure: ${KAKAO_STATE_COOKIE_SECURE:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
    app-redirect-uri: ${GOOGLE_APP_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/app-callback}
    state-cookie-secure: ${GOOGLE_STATE_COOKIE_SECURE:false}
  aws:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET}
      presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:600}
  push:
    expo:
      # EAS 프로젝트 Access Token (push 보안 강화용). 비어 있으면 푸시를 보내지 않고 로그만 남긴다.
      access-token: ${EXPO_ACCESS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  shutdown: graceful
